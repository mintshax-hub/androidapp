<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Professional Video Batch Processing Studio"
    />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
      if (typeof window.require === 'undefined') {
        window.require = function(module) {
          if (module === 'electron') {
            return {
              ipcRenderer: {
                invoke: () => console.warn("Electron IPC not available in browser"),
                on: () => {},
                send: () => {}
              }
            };
          }
          return null;
        };
      }
    </script>

    <title>Video Batch Studio</title>

    <style>
      /* 3. Basic Loader jab tak React load ho raha ho */
      body {
        margin: 0;
        background-color: #0f172a; /* Dark background matching App.js */
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }
      #initial-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #3b82f6;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(59, 130, 246, 0.1);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #64748b;">
          Initializing Engine...
        </div>
      </div>
    </div>

  </body>
</html>
